databaseChangeLog:
  - changeSet:
      id: v0002-create-users-table
      author: Pavlo Kilko

      preConditions:
      - onFail: MARK_RAN
      - not:
          - tableExists:
              schemaName: public
              tableName: users

      changes:
        - createTable:
            schemaName: public
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: varchar(32)
              - column:
                  name: email
                  type: varchar(64)
                  constraints:
                    nullable: false
#                    unique: true
#                    uniqueConstraintName: uq_users_email
              - column:
                  name: status
                  type: varchar(32)
              - column:
                  name: password_hashed
                  type: varchar(64)
              - column:
                  name: temporary_password_hashed
                  type: varchar(64)
              - column:
                  name: temporary_password_expires_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamptz

        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE public.users
                ADD CONSTRAINT chk_users_last_name_not_blank CHECK (TRIM(last_name) <> ''),
                ADD CONSTRAINT chk_users_first_name_not_blank CHECK (TRIM(first_name) <> ''),
                ADD CONSTRAINT chk_users_middle_name_not_blank CHECK (TRIM(middle_name) <> ''),
                ADD CONSTRAINT chk_users_email_not_blank CHECK (TRIM(email) <> ''),
                ADD CONSTRAINT chk_users_email_lowercase CHECK (email = lower(email)),
                ADD CONSTRAINT chk_users_status_enum CHECK (status IS NULL OR status IN ('EMAIL_SENDING_FAILURE','ACTIVATION_PENDING','ACTIVATION_EXPIRED','ACTIVATED','RECOVERY_PENDING')),
                ADD CONSTRAINT chk_users_password_hashed_not_blank CHECK (TRIM(password_hashed) <> ''),
                ADD CONSTRAINT chk_users_temporary_password_hashed_not_blank CHECK (TRIM(temporary_password_hashed) <> ''),
                ADD CONSTRAINT chk_users_temporary_password_expires_at_future CHECK (temporary_password_expires_at IS NULL OR temporary_password_expires_at >= now());

        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS uq_users_email_active
              ON public.users (email)
              WHERE deleted_at IS NULL;
              
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE public.users
                DROP CONSTRAINT IF EXISTS chk_users_last_name_not_blank,
                DROP CONSTRAINT IF EXISTS chk_users_first_name_not_blank,
                DROP CONSTRAINT IF EXISTS chk_users_middle_name_not_blank,
                DROP CONSTRAINT IF EXISTS chk_users_email_not_blank,
                DROP CONSTRAINT IF EXISTS chk_users_email_lowercase,
                DROP CONSTRAINT IF EXISTS chk_users_status_enum,
                DROP CONSTRAINT IF EXISTS chk_users_password_hashed_not_blank,
                DROP CONSTRAINT IF EXISTS chk_users_temporary_password_hashed_not_blank,
                DROP CONSTRAINT IF EXISTS chk_users_temporary_password_expires_at_future;
        - sql:
            dbms: postgresql
            sql: "DROP INDEX IF EXISTS public.uq_users_email_active;"
        - dropTable:
            schemaName: public
            tableName: users
            cascadeConstraints: true