databaseChangeLog:
  - changeSet:
      id: v0003-create-roles-table
      author: Pavlo Kilko

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: public
                tableName: roles

      changes:
        - createTable:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_roles_type

        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE public.roles
                ADD CONSTRAINT chk_roles_type_not_blank CHECK (TRIM(type) <> '');

        - insert:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: type
                  value: "ORGANIZER"

        - insert:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: type
                  value: "SYSADMIN"

        - insert:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: type
                  value: "ADMIN"

        - insert:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: type
                  value: "LECTURER"

        - insert:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: type
                  value: "STUDENT"

        - insert:
            schemaName: public
            tableName: roles
            columns:
              - column:
                  name: type
                  value: "USER"

      rollback:
        - delete:
            schemaName: public
            tableName: roles
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE public.roles
                DROP CONSTRAINT IF EXISTS chk_roles_type_not_blank;
        - dropTable:
            schemaName: public
            tableName: roles
            cascadeConstraints: true