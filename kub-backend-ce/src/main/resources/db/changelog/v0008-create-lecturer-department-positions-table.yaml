databaseChangeLog:
  - changeSet:
      id: v0008-create-lecturer-department-positions-table
      author: Yaroslav Drovolskyi

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: public
                tableName: lecturer_department_positions

      changes:
        - createTable:
            schemaName: public
            tableName: lecturer_department_positions
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: lecturer_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: position_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(64)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: public
            tableName: lecturer_department_positions
            columnNames: id
            constraintName: pk_lecturer_department_positions

        - addAutoIncrement:
            schemaName: public
            tableName: lecturer_department_positions
            columnName: id
            columnDataType: bigint
            startWith: 1
            incrementBy: 1
            defaultOnNull: false
            generationType: ALWAYS

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: lecturer_department_positions
            baseColumnNames: lecturer_id
            constraintName: fk_lecturer_department_positions_lecturers
            referencedTableSchemaName: public
            referencedTableName: lecturers
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: lecturer_department_positions
            baseColumnNames: department_id
            constraintName: fk_lecturer_department_positions_departments
            referencedTableSchemaName: public
            referencedTableName: departments
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: lecturer_department_positions
            baseColumnNames: position_id
            constraintName: fk_lecturer_department_positions_positions
            referencedTableSchemaName: public
            referencedTableName: positions
            referencedColumnNames: id
            onDelete: CASCADE

        - addUniqueConstraint:
            schemaName: public
            tableName: lecturer_department_positions
            columnNames: lecturer_id, department_id
            constraintName: unique_lecturer_department_positions_department_id_lecturer_id

        # add check constraints
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE public.lecturer_department_positions
                ADD CONSTRAINT chk_lecturer_department_positions_status CHECK (status IN ('ACTIVE', 'INACTIVE', 'TERMINATED'));
              

      rollback:
        - dropTable:
            schemaName: public
            tableName: lecturer_department_positions
            cascadeConstraints: true