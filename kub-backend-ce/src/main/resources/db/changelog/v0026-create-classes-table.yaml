databaseChangeLog:
  - changeSet:
      id: v0026-create-classes-table
      author: Yaroslav Drovolskyi

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: public
                tableName: classes

      changes:
        - createTable:
            schemaName: public
            tableName: classes
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: timetable_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: select_subj_act_group_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: selected_room_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: time_start
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: time_end
                  type: timestamptz
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: public
            tableName: classes
            columnNames: id
            constraintName: pk_classes

        - addAutoIncrement:
            schemaName: public
            tableName: classes
            columnName: id
            columnDataType: bigint
            startWith: 1
            incrementBy: 1
            defaultOnNull: false
            generationType: ALWAYS

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: classes
            baseColumnNames: timetable_id
            constraintName: fk_classes_timetables
            referencedTableSchemaName: public
            referencedTableName: timetables
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: classes
            baseColumnNames: select_subj_act_group_id
            constraintName: fk_classes_selected_subj_act_groups
            referencedTableSchemaName: public
            referencedTableName: selected_subj_act_groups
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: classes
            baseColumnNames: selected_room_id
            constraintName: fk_classes_selected_rooms
            referencedTableSchemaName: public
            referencedTableName: selected_rooms
            referencedColumnNames: id
            onDelete: CASCADE

        # add check constrains
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE public.classes
                ADD CONSTRAINT chk_classes_type CHECK (type IN ('ONLINE', 'OFFLINE', 'HYBRID'));
              

      rollback:
        - dropTable:
            schemaName: public
            tableName: classes
            cascadeConstraints: true