databaseChangeLog:
  - changeSet:
      id: v0012-create-specialties-table
      author: Yaroslav Drovolskyi

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: public
                tableName: specialties

      changes:
        - createTable:
            schemaName: public
            tableName: specialties
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: study_field_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: public
            tableName: specialties
            columnNames: id
            constraintName: pk_specialties

        - addAutoIncrement:
            schemaName: public
            tableName: specialties
            columnName: id
            columnDataType: bigint
            startWith: 1
            incrementBy: 1
            defaultOnNull: false
            generationType: ALWAYS

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: specialties
            baseColumnNames: study_field_id
            constraintName: fk_specialties_study_fields
            referencedTableSchemaName: public
            referencedTableName: study_fields
            referencedColumnNames: id
            onDelete: CASCADE

        - addUniqueConstraint:
            schemaName: public
            tableName: specialties
            columnNames: code
            constraintName: unique_specialties_code

        # add check constrains
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE public.specialties
                ADD CONSTRAINT chk_specialties_code_not_empty CHECK (code <> ''),
                ADD CONSTRAINT chk_specialties_name_not_empty CHECK (name <> '');
              

        # populate created table with intial data
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(1, '111', 'Mathematics');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(1, '112', 'Statistics');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(1, '113', 'Applied mathematics');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(2, '121', 'Software engineering');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(2, '122', 'Computer science');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(2, '123', 'Computer engineering');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(2, '124', 'System analysis');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(2, '125', 'Cybersecurity and information protection');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(2, '126', 'Information systems and technologies');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(3, 'E7', 'Mathematics');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(3, 'E8', 'Statistics');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F1', 'Applied mathematics');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F2', 'Software engineering');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F3', 'Computer science');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F4', 'Systems Analysis and Data Science');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F5', 'Cybersecurity and information protection');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F6', 'Information systems and technologies');
              INSERT INTO public.specialties(study_field_id, code, name) VALUES(4, 'F7', 'Computer Engineering');

      rollback:
        - dropTable:
            schemaName: public
            tableName: specialties
            cascadeConstraints: true