databaseChangeLog:
  - changeSet:
      id: v0006-create-students-table
      author: Yaroslav Drovolskyi

      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: public
                tableName: students

      changes:
        - createTable:
            schemaName: public
            tableName: students
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: public
            tableName: students
            columnNames: id
            constraintName: pk_students

        - addAutoIncrement:
            schemaName: public
            tableName: students
            columnName: id
            columnDataType: bigint
            startWith: 1
            incrementBy: 1
            defaultOnNull: false
            generationType: ALWAYS

        - addForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: students
            baseColumnNames: user_id
            constraintName: fk_student_user
            referencedTableSchemaName: public
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - addUniqueConstraint:
            schemaName: public
            tableName: students
            columnNames: user_id
            constraintName: unique_students_user_id


      rollback:
        - dropUniqueConstraint:
            schemaName: public
            tableName: students
            constraintName: unique_students_user_id

        - dropForeignKeyConstraint:
            baseTableSchemaName: public
            baseTableName: students
            constraintName: fk_student_user

        - dropTable:
            schemaName: public
            tableName: students
            cascadeConstraints: true