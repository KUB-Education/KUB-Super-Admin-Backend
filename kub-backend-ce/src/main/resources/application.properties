spring.application.name=kub-backend-ce

spring.config.import=optional:file:./config/secrets.properties

spring.jackson.property-naming-strategy=SNAKE_CASE

server.port=${server.port}

app.account-registration.temporary-password-expiration-days=${account-registration.temporary-password-expiration-days}

app.security.secret-key=${security.secret-key}
app.security.access-token-validity-ms=${security.access-token-validity-ms}
app.security.refresh-token-validity-ms=${security.refresh-token-validity-ms}

spring.mail.host=${smtp.host}
spring.mail.port=${smtp.port}
spring.mail.username=${smtp.username}
spring.mail.password=${smtp.password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.url=${datasource.url}
spring.datasource.username=${datasource.username}
spring.datasource.password=${datasource.password}

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.data.redis.host=${data.redis.host}
spring.data.redis.port=${data.redis.port}
spring.data.redis.username=${data.redis.username}
spring.data.redis.password=${data.redis.password}